name: Daily A-share data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Update mode
        required: true
        default: manual
        type: choice
        options:
          - manual
          - open-check
          - luxembourg-morning
          - close-decision
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-market-update.yml"
      - "requirements.txt"
      - "scripts/update_market_data.py"
  schedule:
    - cron: "35 1 * * 1-5"
    - cron: "0 4,5 * * 1-5"
    - cron: "50 6 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install data dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Resolve update mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "push" ]]; then
            echo "value=manual" >> "$GITHUB_OUTPUT"
            echo "guard=" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "35 1 * * 1-5" ]]; then
            echo "value=open-check" >> "$GITHUB_OUTPUT"
            echo "guard=" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "50 6 * * 1-5" ]]; then
            echo "value=close-decision" >> "$GITHUB_OUTPUT"
            echo "guard=" >> "$GITHUB_OUTPUT"
          else
            echo "value=luxembourg-morning" >> "$GITHUB_OUTPUT"
            echo "guard=--require-lux-hour 6" >> "$GITHUB_OUTPUT"
          fi
      - name: Update dashboard snapshot
        run: python scripts/update_market_data.py --mode "${{ steps.mode.outputs.value }}" ${{ steps.mode.outputs.guard }}
      - name: Commit changed data
        shell: bash
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "a-share-dashboard-bot"
          git config user.email "a-share-dashboard-bot@users.noreply.github.com"
          git add data/
          git commit -m "data: update A-share snapshot"
          git push
